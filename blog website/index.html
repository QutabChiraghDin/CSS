<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Blog</title>

    <style>

        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial;
            background-color: #f2f2f2;
        }

        nav{
            background-color: black;
            color: white;

            padding: 20px;

            display: flex;
            justify-content: space-between;
        }

        nav a{
            color: white;
            margin-left: 20px;
        }

        .heading{
            text-align: center;
            padding: 40px;
        }

        .blogs{
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card{
            background-color: white;
            width: 300px;
            padding: 20px;

            border-radius: 10px;
        }

        .card img{
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .card h2{
            margin-top: 15px;
        }

        .card p{
            margin-top: 10px;
            color: gray;
        }

        .read{
            display: inline-block;
            margin-top: 15px;
        }

    </style>
</head>

<body>

    <nav>

        <h2>My Blog</h2>

        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>

    </nav>

    <div class="heading">

        <h1>Latest Posts</h1>

        <p>Welcome to my blog</p>

    </div>

    <div class="blogs">

        <div class="card">

            <img src="images.jpg">

            <h2>Learn HTML</h2>

            <p>
                HTML is the basic language used to create websites.
            </p>

            <a class="read" href="#">Read More</a>

        </div>

        <div class="card">

            <img src="images.jpg">

            <h2>Learn CSS</h2>

            <p>
                CSS is used to style and design websites.
            </p>

            <a class="read" href="#">Read More</a>

        </div>

        <div class="card">

            <img src="images.jpg">

            <h2>Web Development</h2>

            <p>
                Start learning web development step by step.
            </p>

            <a class="read" href="#">Read More</a>

        </div>

    </div>

</body>
</html>
