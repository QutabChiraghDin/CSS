<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Store</title>

    <style>

        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        nav{
            background-color: black;
            color: white;

            padding: 20px;

            display: flex;
            justify-content: space-between;
        }

        nav a{
            color: white;
            margin-left: 20px;
        }

        .heading{
            text-align: center;
            padding: 40px;
        }

        .products{
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .product{
            width: 250px;

            border: 1px solid gray;
            padding: 15px;

            text-align: center;
            border-radius: 10px;
        }

        .product img{
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .product h2{
            margin: 10px;
        }

        .price{
            color: green;
            font-size: 20px;
        }

        button{
            margin-top: 15px;
            padding: 10px 20px;

            background-color: black;
            color: white;

            border: none;
            border-radius: 5px;
        }

    </style>
</head>

<body>

    <nav>

        <h2>My Store</h2>

        <div>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Cart</a>
        </div>

    </nav>

    <div class="heading">

        <h1>Our Products</h1>

        <p>Choose your favorite product</p>

    </div>

    <div class="products">

        <div class="product">

            <img src="images.jpg">

            <h2>Headphones</h2>

            <p class="price">$25</p>

            <button>Buy Now</button>

        </div>

        <div class="product">

            <img src="images.jpg">

            <h2>Smart Watch</h2>

            <p class="price">$40</p>

            <button>Buy Now</button>

        </div>

        <div class="product">

            <img src="images.jpg">

            <h2>Shoes</h2>

            <p class="price">$50</p>

            <button>Buy Now</button>

        </div>

    </div>

</body>
</html>
