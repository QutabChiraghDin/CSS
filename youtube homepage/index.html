<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YouTube</title>

    <style>

        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial;
        }

        nav{
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 15px 30px;

            border-bottom: 1px solid gray;
        }

        .logo{
            color: red;
            font-size: 25px;
            font-weight: bold;
        }

        .search{
            width: 400px;
            padding: 12px;

            border: 1px solid gray;
            border-radius: 20px;
        }

        .container{
            display: flex;
        }

        .side{
            width: 180px;
            padding: 20px;
        }

        .side p{
            margin-bottom: 25px;
        }

        .videos{
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        .card{
            width: 280px;
        }

        .card img{
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 10px;
        }

        .card h3{
            margin-top: 10px;
        }

        .card p{
            color: gray;
            margin-top: 5px;
        }

    </style>
</head>

<body>

    <nav>

        <div class="logo">
            YouTube
        </div>

        <input class="search" type="text" placeholder="Search">

        <div>
            👤
        </div>

    </nav>

    <div class="container">

        <div class="side">

            <p>Home</p>
            <p>Shorts</p>
            <p>Subscriptions</p>
            <p>History</p>
            <p>Watch Later</p>

        </div>

        <div class="videos">

            <div class="card">
                <img src="images.jpg">
                <h3>Learn HTML and CSS</h3>
                <p>Web Development</p>
            </div>

            <div class="card">
                <img src="images.jpg">
                <h3>CSS Beginner Tutorial</h3>
                <p>Code Academy</p>
            </div>

            <div class="card">
                <img src="images.jpg">
                <h3>Build Your First Website</h3>
                <p>Programming</p>
            </div>

            <div class="card">
                <img src="images.jpg">
                <h3>Learn Web Development</h3>
                <p>Developer World</p>
            </div>

        </div>

    </div>

</body>
</html>
